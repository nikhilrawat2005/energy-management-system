version: '3.8'

services:
  # 1. Mosquitto MQTT Broker
  mosquitto:
    image: eclipse-mosquitto:2.0
    container_name: maems_mosquitto
    restart: always
    ports:
      - "1883:1883"
      - "9001:9001"
    volumes:
      - ./config/mosquitto.conf:/mosquitto/config/mosquitto.conf
      - mosquitto_data:/mosquitto/data
      - mosquitto_log:/mosquitto/log

  # 2. TimescaleDB (PostgreSQL for Time-Series telemetry)
  timescaledb:
    image: timescale/timescaledb:latest-pg15
    container_name: maems_timescaledb
    restart: always
    ports:
      - "5434:5432"
    environment:
      POSTGRES_USER: maems_user
      POSTGRES_PASSWORD: maems_password
      POSTGRES_DB: maems_energy
    volumes:
      - timescaledb_data:/var/lib/postgresql/data
      - ./ingestion/init_db.sql:/docker-entrypoint-initdb.d/init.sql

  # 3. Grafana (Real-time monitoring dashboards)
  grafana:
    image: grafana/grafana:latest
    container_name: maems_grafana
    restart: always
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_PANELS_DISABLE_SANITIZE_HTML=true
      - GF_FEATURE_TOGGLES_ENABLE=publicDashboards
      - GF_SERVER_ROOT_URL=http://localhost:3001
    volumes:
      - grafana_data:/var/lib/grafana
      - ./config/grafana/provisioning:/etc/grafana/provisioning
    depends_on:
      - timescaledb

  # 4. Ollama Local LLM Engine (Central AI Multi-Agent Coordinator)
  ollama:
    image: ollama/ollama:latest
    container_name: maems_ollama
    restart: always
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama

volumes:
  mosquitto_data:
  mosquitto_log:
  timescaledb_data:
  grafana_data:
  ollama_data:
